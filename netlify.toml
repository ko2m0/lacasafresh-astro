[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


    # Custom 404 handling
    
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404